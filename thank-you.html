<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Richiesta inviata | Dina Fiorentino</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Poppins, sans-serif;
        background: linear-gradient(
          180deg,
          hsl(245 60% 98%) 0%,
          hsl(270 70% 97%) 50%,
          hsl(330 80% 97%) 100%
        );
      }

      .card {
        background: white;
        max-width: 600px;
        padding: 50px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(90, 82, 224, 0.15);
      }

      h1 {
        color: #15171f;
        margin-bottom: 20px;
      }

      p {
        color: #6b6e84;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .button {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, hsl(245 75% 60%), hsl(265 80% 68%));
        color: white;
        padding: 15px 28px;
        border-radius: 999px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>✅ Richiesta inviata con successo</h1>

      <p>
        Grazie per aver richiesto una consulenza. Ho ricevuto il tuo messaggio e
        ti ricontatterò il prima possibile per approfondire le tue esigenze.
      </p>

      <a href="../landing-page/index.html" class="button">
        Torna al portfolio
      </a>
    </div>
  </body>
</html>
